name: Build PyInstaller (Tag)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Resolve tag version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with 'v'. got: $tag"
          }
          $version = $tag.Substring(1)
          "IRIC_DATASCOPE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARCHIVE_NAME=iRIC_DataScope-$tag-windows-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DOCS_ARCHIVE_NAME=iRIC_DataScope-$tag-docs.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES_PATH=docs/release_notes/$tag.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_BODY_PATH=release/release-body.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync dependencies for build
        run: uv sync --frozen --group build --group dev

      - name: Build documentation
        run: uv run mkdocs build --strict -f mkdocs.release.yml

      - name: Archive documentation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "build_docs\release_site\*" -DestinationPath "release\$env:DOCS_ARCHIVE_NAME" -Force

      - name: Build EXE with PyInstaller
        run: uv run pyinstaller --noconfirm iRIC_DataScope.spec

      - name: Archive build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path "dist\*" -DestinationPath "release\$env:ARCHIVE_NAME" -Force

      - name: Prepare release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path $env:RELEASE_NOTES_PATH)) {
            throw "Release notes file not found: $env:RELEASE_NOTES_PATH"
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          Get-Content $env:RELEASE_NOTES_PATH -Raw | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8
          "" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append
          "## GitHub generated release notes" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append
          "" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append
          gh api "repos/${{ github.repository }}/releases/generate-notes" `
            -f "tag_name=${{ github.ref_name }}" `
            --jq ".body" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append
          "" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append
          "## Included artifacts" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append
          "" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append
          "- ``$env:ARCHIVE_NAME``" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append
          "- ``$env:DOCS_ARCHIVE_NAME``" | Out-File -FilePath $env:RELEASE_BODY_PATH -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-windows
          path: release/${{ env.ARCHIVE_NAME }}

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: release/${{ env.DOCS_ARCHIVE_NAME }}

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          body_path: ${{ env.RELEASE_BODY_PATH }}
          files: |
            release/${{ env.ARCHIVE_NAME }}
            release/${{ env.DOCS_ARCHIVE_NAME }}
